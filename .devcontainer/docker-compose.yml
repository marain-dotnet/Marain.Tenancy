version: '3.8'

services:
  app:
    # Use the same base image as the current devcontainer
    image: mcr.microsoft.com/devcontainers/dotnet:1-8.0-bookworm
    
    # Keep the container running for development
    command: sleep infinity
    
    # Expose ports for MinimalApi access from host
    ports:
      - "5138:5138"   # HTTP port for MinimalApi
      - "7124:7124"   # HTTPS port for MinimalApi
      - "8080:8080"   # Docker HTTP port
      - "8081:8081"   # Docker HTTPS port
    
    # Mount the workspace
    volumes:
      - ..:/workspaces/Marain.Tenancy:cached
      
    # Development environment variables
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - REMOTE_CONTAINERS=true
      - ASPNETCORE_URLS=http://+:5138;https://+:7124
      - ASPNETCORE_HTTP_PORTS=5138;8080
      - ASPNETCORE_HTTPS_PORTS=7124;8081
      - AZURE_STORAGE_CONNECTION_STRING=DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;QueueEndpoint=http://azurite:10001/devstoreaccount1;TableEndpoint=http://azurite:10002/devstoreaccount1;
    
    # Ensure azurite starts before the app container
    depends_on:
      - azurite
    
    # Connect to the development network
    networks:
      - devcontainer

  # Azurite service for local Azure Storage emulation
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    
    # Expose ports for development access
    ports:
      - "10000:10000"  # Blob service
      - "10001:10001"  # Queue service  
      - "10002:10002"  # Table service
    
    # Persist data across container restarts
    volumes:
      - azurite_data:/data
    
    # Configure Azurite for development
    command: [
      "azurite", 
      "--blobHost", "0.0.0.0", 
      "--queueHost", "0.0.0.0", 
      "--tableHost", "0.0.0.0", 
      "--location", "/data",
      "--debug", "/dev/stdout"
    ]
    
    # Connect to the development network
    networks:
      - devcontainer

# Development network for service communication
networks:
  devcontainer:
    driver: bridge

# Persistent volume for Azurite data
volumes:
  azurite_data:
    driver: local